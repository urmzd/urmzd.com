<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Page not found · urmzd</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="/brand/fonts.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/brand/theme.js"></script>
  <script>
    // Guides that moved to their own domain keep their old deep links.
    (function () {
      var moved = { humagen: "https://docs.humagen.com/" };
      var match = location.pathname.match(/^\/([^/]+)\/(.*)$/);
      if (match && moved[match[1]]) {
        location.replace(moved[match[1]] + match[2] + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header>
    <div class="bar">
      <a class="home" href="https://urmzd.com/" aria-label="urmzd home" title="urmzd home"><span class="mark" aria-hidden="true"></span></a>
      <nav class="site-nav" aria-label="Site navigation">
        <a href="https://urmzd.com/projects/">Projects</a>
        <a href="/">Docs</a>
      </nav>
      <div class="controls">
        <a class="control" href="https://github.com/urmzd/urmzd.com/tree/main/docs-site" aria-label="Documentation source on GitHub" title="Documentation source on GitHub">
          <svg aria-hidden="true"><use href="/brand/icons.svg#github"></use></svg>
        </a>
        <button class="control" data-theme-toggle type="button" aria-label="Switch theme" hidden>
          <svg aria-hidden="true"><use href="/brand/icons.svg#sun"></use></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="error">
    <p class="status">404</p>
    <h1>Page not found</h1>
    <a class="back" href="/">Browse the project guides</a>
  </main>
</body>
</html>
