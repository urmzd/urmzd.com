name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: urmzd/sr@v8
        id: sr
        with:
          github-token: ${{ steps.app-token.outputs.token }}

    outputs:
      released: ${{ steps.sr.outputs.released }}
      tag: ${{ steps.sr.outputs.tag }}

  deploy:
    name: Deploy
    needs: release
    uses: urmzd/infra/.github/workflows/deploy-site.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      source_repo: ${{ github.repository }}
      ref: ${{ github.sha }}
      domain: urmzd.com
      package_manager: npm
      build_command: npm run build
      s3_bucket: urmzd.com
      s3_sync_delete_exclude: ""
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
      aws_region: ${{ secrets.AWS_REGION }}
