name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    environment: release
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: urmzd/sr@v9
        id: sr
        with:
          github-token: ${{ steps.app-token.outputs.token }}

    outputs:
      released: ${{ steps.sr.outputs.released }}
      tag: ${{ steps.sr.outputs.tag }}

  deploy:
    name: Deploy
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://urmzd.com
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      BUCKET: urmzd.com
      DOMAIN: urmzd.com
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The projects loader lists repos through the GitHub API; anonymous calls
      # share the runner IP's 60 req/hr limit and fail the build when it is spent.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify build output
        run: test -n "$(ls -A dist 2>/dev/null)" || { echo "::error::dist is empty"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Hashed assets are immutable; HTML and feeds must revalidate. Both passes
      # delete, so a removed page's HTML does not stay live in the bucket.
      - name: Upload to S3
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "*.xml" --exclude "*.json" --exclude "*.txt" \
            --exclude "sw.js" --exclude "manifest.webmanifest"
          aws s3 sync dist "s3://$BUCKET" --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.json" --include "*.txt"
          if [ -f dist/sw.js ]; then
            aws s3 cp dist/sw.js "s3://$BUCKET/sw.js" --cache-control "no-cache, no-store, must-revalidate"
          fi
          if [ -f dist/manifest.webmanifest ]; then
            aws s3 cp dist/manifest.webmanifest "s3://$BUCKET/manifest.webmanifest" \
              --cache-control "public, max-age=0, must-revalidate" --content-type "application/manifest+json"
          fi

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '$DOMAIN')].Id | [0]" --output text)
          [ -n "$id" ] && [ "$id" != "None" ] || { echo "::error::No distribution for $DOMAIN"; exit 1; }
          aws cloudfront create-invalidation --distribution-id "$id" --paths "/*"
